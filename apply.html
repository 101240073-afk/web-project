
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for a Job | Work Link</title>
    <link rel="stylesheet" href="workerstyle.css">
    <script src="applyScript.js" defer></script>
</head>

<body class="apply-page-body">

    <main class="apply-page">

        <div class="apply-container">

            <a href="find-jobs.html" class="back-link">
                ← Back to Jobs
            </a>

            <div class="apply-heading">
                <p class="apply-subtitle">WORK LINK</p>
                <h1>Apply for this Job</h1>
                <p>Complete the form below to send your application.</p>
            </div>

            <form class="application-form" id="applicationForm">

                <h2>Your Information</h2>

                <div class="form-row">

                    <div class="form-group">
                        <label for="applicantName">Full Name</label>
                        <input type="text" id="applicantName"
                               placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="applicantEmail">Email Address</label>
                        <input type="email" id="applicantEmail"
                               placeholder="Enter your email" required>
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="applicantPhone">Phone Number</label>
                        <input type="tel" id="applicantPhone"
                               placeholder="Enter your phone number" required>
                    </div>

                    <div class="form-group">
                        <label for="applicantExperience">Years of Experience</label>
                        <select id="applicantExperience" required>
                            <option value="">Select experience</option>
                            <option value="Less than 1 year">Less than 1 year</option>
                            <option value="1-3 years">1-3 years</option>
                            <option value="3-5 years">3-5 years</option>
                            <option value="More than 5 years">More than 5 years</option>
                        </select>
                    </div>

                </div>

                <div class="form-group">
                    <label for="applicantMessage">Why are you suitable for this job?</label>
                    <textarea id="applicantMessage"
                              placeholder="Tell the employer about your skills and experience..."
                              rows="5" required></textarea>
                </div>

                <p id="applicationMessage"></p>

                <button type="submit" class="btn-primary">
                    Submit Application
                </button>

            </form>

        </div>

    </main>

</body>
</html>
